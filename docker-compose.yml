services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension (for vector similarity search)
  # ----------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: astrorag-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-astrorag}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astrorag_secure_password}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-astrorag}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ----------------------------------------------------------------------------
  # AstroRAG Next.js Web Application
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astrorag-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-astrorag_secure_password}@db:5432/${POSTGRES_DB:-astrorag}
      - SESSION_SECRET=${SESSION_SECRET:-astro_rag_production_session_secret_at_least_32_characters_long}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - USER_PASSWORD=${USER_PASSWORD:-}
      - AUTO_SEED=${AUTO_SEED:-true}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local

